<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Soma CRM - Funil Pro</title>
    <script>
      (function() {
        function makeWritable(obj, prop) {
          try {
            if (!obj || !(prop in obj)) return;
            var currentVal = obj[prop];
            Object.defineProperty(obj, prop, {
              get: function() { return currentVal; },
              set: function(val) { currentVal = val; },
              configurable: true,
              enumerable: true
            });
          } catch (e) {
            // Ignore if already configurable/writable
          }
        }
        makeWritable(window, 'fetch');
        makeWritable(globalThis, 'fetch');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
